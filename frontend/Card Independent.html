nt-weight: 600;\n    letter-spacing: 0.03em;\n    text-transform: uppercase;\n    color: rgba(238,241,245,0.8);\n    opacity: 0;\n    transform: scale(0.82);\n    transition: opacity 0.3s ease, transform 0.3s ease;\n  }\n  .mini-card.show { opacity: 1; transform: scale(1); }\n\n  .dispatch-overlay {\n    position: fixed;\n    inset: 0;\n    z-index: 1;\n    display: none;\n    flex-wrap: wrap;\n    align-content: center;\n    justify-content: center;\n    gap: 16px;\n    padding: 60px;\n    pointer-events: none;\n  }\n  .dispatch-overlay.active { display: flex; }\n\n  .solo-card {\n    width: 130px;\n    height: 64px;\n    padding: 6px 10px;\n    border-radius: 10px;\n    background: rgba(255,255,255,0.06);\n    border: 1px solid rgba(255,255,255,0.16);\n    backdrop-filter: blur(16px) saturate(140%);\n    -webkit-backdrop-filter: blur(16px) saturate(140%);\n    box-shadow: 0 10px 30px rgba(0,0,0,0.35);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    text-align: center;\n    font-size: 11.5px;\n    font-weight: 600;\n    letter-spacing: 0.03em;\n    text-transform: uppercase;\n    color: rgba(238,241,245,0.85);\n    opacity: 0;\n    transform: scale(0.8);\n    transition: opacity 0.35s ease, transform 0.35s ease;\n  }\n  .solo-card.show { opacity: 1; transform: scale(1); }\n  .solo-card.dispatch { opacity: 0; transform: translateX(160%) scale(0.95); }\n\n  .confirm-overlay {\n    position: fixed;\n    z-index: 2;\n    top: 50%;\n    left: 50%;\n    transform: translate(-50%, -50%);\n    padding: 18px 32px;\n    border-radius: 14px;\n    background: rgba(255,255,255,0.08);\n    border: 1px solid rgba(255,255,255,0.18);\n    backdrop-filter: blur(20px) saturate(140%);\n    -webkit-backdrop-filter: blur(20px) saturate(140%);\n    font-size: 13px;\n    font-weight: 600;\n    letter-spacing: 0.14em;\n    text-transform: uppercase;\n    color: #6fe3a0;\n    opacity: 0;\n    pointer-events: none;\n    transition: opacity 0.35s ease;\n    white-space: nowrap;\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n  <div class=\"bg-text\">PURE<\u002Fdiv>\n\n  <div class=\"card\">\n    <div class=\"card-body\" id=\"card-body\">\n    <p class=\"eyebrow\">Trade Dispatch<\u002Fp>\n    <h1>Order Intent<\u002Fh1>\n\n    <form id=\"order-form\">\n      <div class=\"field\">\n        <label for=\"instrument\">Instrument<\u002Flabel>\n        <input type=\"text\" id=\"instrument\" placeholder=\"EURUSD\" autocomplete=\"off\" required=\"\">\n      <\u002Fdiv>\n\n      <div class=\"field\">\n        <label>Side<\u002Flabel>\n        <div class=\"side-toggle\" id=\"side-toggle\">\n          <button type=\"button\" data-side=\"buy\" class=\"active\">Buy<\u002Fbutton>\n          <button type=\"button\" data-side=\"sell\">Sell<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"field\">\n        <label for=\"setup\">Setup<\u002Flabel>\n        <select id=\"setup\">\n          <option value=\"jcp\">JCP<\u002Foption>\n          <option value=\"dipndot\">Dip N Dot<\u002Foption>\n          <option value=\"testsetup\">Test Setup<\u002Foption>\n        <\u002Fselect>\n      <\u002Fdiv>\n\n      <div class=\"row2\">\n        <div class=\"field\">\n          <label for=\"stop_loss\">Stop Loss<\u002Flabel>\n          <input type=\"text\" id=\"stop_loss\" placeholder=\"1.14730\" autocomplete=\"off\" required=\"\">\n        <\u002Fdiv>\n        <div class=\"field\">\n          <label for=\"take_profit\">Take Profit<\u002Flabel>\n          <input type=\"text\" id=\"take_profit\" placeholder=\"1.12757\" autocomplete=\"off\" required=\"\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <button type=\"submit\" class=\"submit\" id=\"submit-btn\">Place Order<\u002Fbutton>\n    <\u002Fform>\n\n    <div class=\"results\" id=\"results\"><\u002Fdiv>\n    <p class=\"notice\" id=\"notice\"><\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"dispatch-grid\" id=\"dispatch-grid\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"dispatch-overlay\" id=\"dispatch-overlay\"><\u002Fdiv>\n\n  <div class=\"confirm-overlay\" id=\"confirm-overlay\">Order Sent<\u002Fdiv>\n\n<script>\n  // 'independent' — each account gets its own free-floating card scattered across\n  // the screen, then every card dispatches right on its own. This is current.\n  // 'grouped' — the previous behavior: mini-cards stay inside the Trade Dispatch\n  // card and the whole card flies right together. Flip this back to revert.\n  const DISPATCH_STYLE = 'independent';\n\n  const sideToggle = document.getElementById('side-toggle');\n  let side = 'buy';\n  sideToggle.addEventListener('click', (e) => {\n    const btn = e.target.closest('button');\n    if (!btn) return;\n    side = btn.dataset.side;\n    sideToggle.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));\n  });\n\n  const form = document.getElementById('order-form');\n  const card = document.querySelector('.card');\n  const cardBody = document.getElementById('card-body');\n  const dispatchGrid = document.getElementById('dispatch-grid');\n  const dispatchOverlay = document.getElementById('dispatch-overlay');\n  const confirmOverlay = document.getElementById('confirm-overlay');\n  const resultsEl = document.getElementById('results');\n  const noticeEl = document.getElementById('notice');\n  const submitBtn = document.getElementById('submit-btn');\n\n  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));\n\n  function resetSideToggle() {\n    side = 'buy';\n    sideToggle.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.side === 'buy'));\n  }\n\n  // Previous behavior — kept so DISPATCH_STYLE = 'grouped' still works.\n  async function runGroupedDispatch(accountNames) {\n    dispatchGrid.innerHTML = '';\n    accountNames.forEach((name) => {\n      const el = document.createElement('div');\n      el.className = 'mini-card';\n      el.textContent = name;\n      dispatchGrid.appendChild(el);\n    });\n    cardBody.style.display = 'none';\n    dispatchGrid.classList.add('active');\n\n    await sleep(20); // let layout settle before triggering the show transition\n    const miniEls = dispatchGrid.querySelectorAll('.mini-card');\n    miniEls.forEach((el, i) => setTimeout(() => el.classList.add('show'), i * 30));\n    await sleep(miniEls.length * 30 + 280);\n\n    card.style.transform = 'translateX(160%) rotate(3deg)';\n    card.style.opacity = '0';\n    await sleep(550);\n\n    dispatchGrid.classList.remove('active');\n    dispatchGrid.innerHTML = '';\n    cardBody.style.display = '';\n  }\n\n  // Current behavior — each account is its own isolated card, filling the screen.\n  async function runIndependentDispatch(accountNames) {\n    card.style.transition = 'opacity 0.3s ease';\n    card.style.opacity = '0';\n    await sleep(260);\n    card.style.display = 'none';\n\n    dispatchOverlay.innerHTML = '';\n    accountNames.forEach((name) => {\n      const el = document.createElement('div');\n      el.className = 'solo-card';\n      el.textContent = name;\n      dispatchOverlay.appendChild(el);\n    });\n    dispatchOverlay.classList.add('active');\n\n    await sleep(20); // let layout settle before triggering the show transition\n    const soloEls = dispatchOverlay.querySelectorAll('.solo-card');\n    soloEls.forEach((el, i) => setTimeout(() => el.classList.add('show'), i * 25));\n    await sleep(soloEls.length * 25 + 350);\n\n    soloEls.forEach((el, i) => setTimeout(() => el.classList.add('dispatch'), i * 15));\n    await sleep(soloEls.length * 15 + 550);\n\n    dispatchOverlay.classList.remove('active');\n    dispatchOverlay.innerHTML = '';\n    card.style.display = '';\n    card.style.transition = 'transform 0.55s cubic-bezier(0.4,0,0.2,1), opacity 0.5s ease';\n  }\n\n  form.addEventListener('submit', async (e) => {\n    e.preventDefault();\n    submitBtn.disabled = true;\n    submitBtn.textContent = 'Dispersing…';\n\n    const payload = {\n      instrument: document.getElementById('instrument').value.trim(),\n      side: side,\n      setup: document.getElementById('setup').value,\n      stop_loss: document.getElementById('stop_loss').value.trim(),\n      take_profit: document.getElementById('take_profit').value.trim(),\n    };\n\n    // The real dispatch is sent (and typically finishes) before this animation\n    // ever gets to the \"fly out\" step — it's a visualization, not a blocker.\n    const data = await (async () => {\n      try {\n        const res = await fetch('/order', {\n          method: 'POST',\n          headers: { 'Content-Type': 'application/json' },\n          body: JSON.stringify(payload),\n        });\n        return await res.json();\n      } catch (err) {\n        // No server reachable — expected while previewing the page on its own.\n        // Stand in with 12 demo accounts so the split animation still reads.\n        return { error: 'Preview mode: no server connected at /order. Run the oms binary to dispatch real orders.' };\n      }\n    })();\n\n    const accountNames = (data.results && data.results.length)\n      ? data.results.map(r => r.account)\n      : Array.from({ length: 12 }, (_, i) => `Account ${i + 1}`);\n\n    if (DISPATCH_STYLE === 'independent') {\n      await runIndependentDispatch(accountNames);\n    } else {\n      await runGroupedDispatch(accountNames);\n    }\n\n    // Confirmation flashes center screen.\n    confirmOverlay.style.opacity = '1';\n    confirmOverlay.style.pointerEvents = 'auto';\n    await sleep(1100);\n    confirmOverlay.style.opacity = '0';\n    confirmOverlay.style.pointerEvents = 'none';\n    await sleep(300);\n\n    // Reset the form and results, then bring a fresh card in from the top.\n    form.reset();\n    resetSideToggle();\n    resultsEl.innerHTML = '';\n    noticeEl.textContent = '';\n    if (data.error) {\n      noticeEl.textContent = data.error;\n    } else if (data.results) {\n      for (const r of data.results) {\n        const row = document.createElement('div');\n        row.className = 'result-row ' + (r.ok ? 'ok' : 'fail');\n        row.innerHTML = `<span class=\"name\">${r.account}<\u002Fspan><span class=\"status\">${r.ok ? 'Sent' : 'Failed'}<\u002Fspan>`;\n        resultsEl.appendChild(row);\n      }\n    }\n\n    card.style.transition = 'none';\n    card.style.transform = 'translateY(-160%)';\n    card.style.opacity = '0';\n    card.offsetHeight; // force reflow so the next transition runs\n    card.style.transition = 'transform 0.6s cubic-bezier(0.4,0,0.2,1), opacity 0.5s ease';\n    card.style.transform = 'translateY(0) translateX(0)';\n    card.style.opacity = '1';\n\n    submitBtn.disabled = false;\n    submitBtn.textContent = 'Place Order';\n  });\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Intent — intent rail demo</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100vh;
    font-family: Helvetica, Arial, sans-serif;
    color: #eef1f5;
    background: linear-gradient(160deg, #161f20, #0d1112);
  }
  body {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  body::before {
    content: "";
    position: fixed;
    width: 620px; height: 620px;
    top: -160px; left: -140px;
    border-radius: 50%;
    filter: blur(90px);
    background: radial-gradient(circle, rgba(59,130,246,0.28), transparent 70%);
    pointer-events: none;
  }

  .stage {
    position: relative;
    width: 100%;
    max-width: 440px;
  }

  .card {
    position: relative;
    z-index: 1;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    backdrop-filter: blur(24px) saturate(140%) contrast(115%);
    -webkit-backdrop-filter: blur(24px) saturate(140%) contrast(115%);
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    padding: 36px 34px 30px;
  }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(238,241,245,0.55);
    margin: 0 0 6px;
  }
  h1 { font-size: 24px; font-weight: 600; margin: 0 0 28px; transition: opacity 0.15s ease; }

  label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(238,241,245,0.6);
    margin-bottom: 8px;
  }
  .field { margin-bottom: 20px; }

  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    font-family: inherit;
    color: #eef1f5;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 10px;
    outline: none;
    transition: border-color 0.15s, background 0.15s;
  }
  input[type="text"]:focus { border-color: rgba(96,165,250,0.7); background: rgba(255,255,255,0.08); }
  input[type="text"]::placeholder { color: rgba(238,241,245,0.35); }

  select {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    font-family: inherit;
    color: #eef1f5;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 10px;
    outline: none;
    appearance: none;
  }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .side-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .side-toggle button {
    padding: 12px 0;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.16);
    background: rgba(255,255,255,0.05);
    color: rgba(238,241,245,0.7);
    cursor: pointer;
  }
  .side-toggle button.active[data-side="buy"] { background: rgba(34,197,94,0.18); border-color: rgba(34,197,94,0.6); color: #6fe3a0; }
  .side-toggle button.active[data-side="sell"] { background: rgba(239,68,68,0.18); border-color: rgba(239,68,68,0.6); color: #ff9d9d; }

  .submit {
    width: 100%;
    margin-top: 8px;
    padding: 14px 0;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #0d1117;
    background: #eef1f5;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .submit:hover { opacity: 0.88; }
  .submit.danger { background: #ff5c5c; color: #2a0a0a; }

  /* ---------- panel swap ---------- */
  .panel { display: none; opacity: 0; transition: opacity 0.18s ease; }
  .panel.active { display: block; opacity: 1; }

  /* ---------- the intent rail ---------- */
  /* idle: a barely-there vertical line — tinted per active intent, nothing else */
  .intent-rail {
    position: absolute;
    top: 14%;
    bottom: 14%;
    left: -1px;
    width: 22px;               /* generous hit target even though the visible line is thin */
    display: flex;
    align-items: center;
    justify-content: flex-start;
    cursor: pointer;
    z-index: 2;
  }
  .rail-line {
    width: 3px;
    height: 100%;
    border-radius: 3px;
    background: var(--rail-tint, rgba(255,255,255,0.22));
    filter: blur(0.3px);
    transition: background 0.3s ease, width 0.2s ease, box-shadow 0.3s ease;
  }
  .intent-rail:hover .rail-line,
  .intent-rail.open .rail-line {
    width: 4px;
    box-shadow: 0 0 14px 1px var(--rail-tint, rgba(255,255,255,0.35));
  }

  /* expanded: a soft cloud panel of labels fades in beside the line */
  .rail-labels {
    position: absolute;
    right: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 14px 18px;
    border-radius: 12px;
    background: rgba(20,24,28,0.55);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    opacity: 0;
    transform: translateX(-6px);
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    white-space: nowrap;
  }
  .intent-rail:hover .rail-labels,
  .intent-rail.open .rail-labels {
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;
  }

  .rail-labels button {
    background: none;
    border: none;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-align: left;
    color: rgba(238,241,245,0.4);
    cursor: pointer;
    padding: 2px 0;
    transition: opacity 0.15s ease-in, color 0.15s ease;
  }
  .rail-labels:hover button { opacity: 0.5; }
  .rail-labels button:hover,
  .rail-labels button:focus-visible {
    opacity: 1 !important;
    color: #eef1f5;
  }
  .rail-labels button.current { color: #eef1f5; opacity: 1; }
  .rail-labels button:focus-visible { outline: 1px solid rgba(96,165,250,0.7); outline-offset: 3px; }

</style>
</head>
<body>

  <div class="stage">
    <div class="card" id="card" style="--rail-tint: rgba(96,165,250,0.35);">
      <p class="eyebrow" id="eyebrow">Trade Dispatch</p>
      <h1 id="heading">Order Intent</h1>

      <!-- ORDER -->
      <div class="panel active" id="panel-order">
        <div class="field">
          <label>Instrument</label>
          <input type="text" placeholder="EURUSD" autocomplete="off">
        </div>
        <div class="field">
          <label>Side</label>
          <div class="side-toggle">
            <button type="button" data-side="buy" class="active">Buy</button>
            <button type="button" data-side="sell">Sell</button>
          </div>
        </div>
        <div class="field">
          <label>Setup</label>
          <select>
            <option>JCP</option>
            <option>Dip N Dot</option>
            <option>Test Setup</option>
          </select>
        </div>
        <div class="row2">
          <div class="field">
            <label>Stop Loss</label>
            <input type="text" placeholder="1.14730" autocomplete="off">
          </div>
          <div class="field">
            <label>Take Profit</label>
            <input type="text" placeholder="1.12757" autocomplete="off">
          </div>
        </div>
        <button class="submit">Place Order</button>
      </div>

      <!-- MODIFY -->
      <div class="panel" id="panel-modify">
        <div class="field">
          <label>Parent ID</label>
          <input type="text" placeholder="a2f9-4d1c-…" autocomplete="off">
        </div>
        <div class="field">
          <label>New Stop Loss</label>
          <input type="text" placeholder="1.14290" autocomplete="off">
        </div>
        <button class="submit">Update Stop</button>
      </div>

      <!-- CLOSE ALL -->
      <div class="panel" id="panel-close">
        <div class="field">
          <label>Parent ID</label>
          <input type="text" placeholder="a2f9-4d1c-…" autocomplete="off">
        </div>
        <button class="submit danger">Close All Positions</button>
      </div>

      <!-- rail: idle = thin tinted line, hover/tap = cloud panel of labels -->
      <div class="intent-rail" id="rail">
        <div class="rail-labels" id="rail-labels">
          <button data-intent="order" class="current">Order</button>
          <button data-intent="modify">Modify</button>
          <button data-intent="close">Close</button>
        </div>
        <div class="rail-line"></div>
      </div>
    </div>
  </div>

<script>
  const card = document.getElementById('card');
  const rail = document.getElementById('rail');
  const railLabels = document.getElementById('rail-labels');
  const heading = document.getElementById('heading');
  const eyebrow = document.getElementById('eyebrow');
  const panels = { order: 'panel-order', modify: 'panel-modify', close: 'panel-close' };
  const meta = {
    order:  { title: 'Order Intent',   eyebrow: 'Trade Dispatch',    tint: 'rgba(96,165,250,0.35)' },
    modify: { title: 'Modify Stop',    eyebrow: 'Position Update',   tint: 'rgba(250,204,21,0.35)' },
    close:  { title: 'Close All',      eyebrow: 'Position Exit',     tint: 'rgba(239,68,68,0.4)'   },
  };

  function selectIntent(name) {
    Object.values(panels).forEach(id => document.getElementById(id).classList.remove('active'));
    document.getElementById(panels[name]).classList.add('active');

    railLabels.querySelectorAll('button').forEach(b =>
      b.classList.toggle('current', b.dataset.intent === name));

    heading.style.opacity = '0';
    setTimeout(() => {
      heading.textContent = meta[name].title;
      eyebrow.textContent = meta[name].eyebrow;
      heading.style.opacity = '1';
    }, 150);

    card.style.setProperty('--rail-tint', meta[name].tint);
    rail.classList.remove('open'); // tap-to-select closes the rail again on mobile
  }

  // tap/click toggles the rail open on touch devices; :hover already
  // handles desktop, this just makes the same element work for taps too.
  rail.addEventListener('click', (e) => {
    if (e.target.closest('.rail-labels')) return; // let label clicks pass through
    rail.classList.toggle('open');
  });

  railLabels.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => selectIntent(btn.dataset.intent));
  });

  document.addEventListener('click', (e) => {
    if (!rail.contains(e.target)) rail.classList.remove('open');
  });
</script>

</body>
</html>

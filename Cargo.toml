[package]
name = "oms"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = "0.4.45"
reqwest = {version = "0.13.4", features = ["json"]}
rust_decimal = "1.42.1"
rust_decimal_macros = "1.40.0"
serde = {version = "1.0.228", features = ["derive"]}
serde_json = "1.0.150"
tokio = { version = "1", features = ["macros", "rt-multi-thread"]}
toml = "1.1.2"
tower-http = "0.7.0"
